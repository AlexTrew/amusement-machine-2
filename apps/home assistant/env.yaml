---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: default
data:
  configuration.yaml: |
    default_config:
    http:
      use_x_forwarded_for: true
      # use the whole /16 address range in case
      # incase the server restarts on a different
      # address
      trusted_proxies:
        - 10.42.0.0/16
