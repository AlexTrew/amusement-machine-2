---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filestash-state
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestash
  namespace: default
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filestash
  template:
    metadata:
      labels:
        app: filestash
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: filestash
          image: machines/filestash:latest
          ports:
            - containerPort: 8334
          env:
            - name: APPLICATION_URL
              value: "files.amusement-zone.house"
          volumeMounts:
            - name: jellyfin-media
              mountPath: /data/jellyfin-media
            - name: state
              mountPath: /app/data/state
          readinessProbe:
            httpGet:
              path: /
              port: 8334
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: filestash-state
        - name: jellyfin-media
          persistentVolumeClaim:
            claimName: jellyfin-media
---
apiVersion: v1
kind: Service
metadata:
  name: filestash
  namespace: default
spec:
  selector:
    app: filestash
  ports:
    - port: 80
      targetPort: 8334
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filestash
  namespace: default
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - files.amusement-zone.house
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: filestash
          port: 80
