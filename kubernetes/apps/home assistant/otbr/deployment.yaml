apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otbr-data
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr
  namespace: default
  labels:
    app: otbr
spec:
  replicas: 1
  strategy:
    type: Recreate # only one pod may own the radio and host ports
  selector:
    matchLabels:
      app: otbr
  template:
    metadata:
      labels:
        app: otbr
    spec:
      hostNetwork: true # needed for IPv6 RAs and mDNS on the LAN
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: otbr
          image: openthread/border-router:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true # radio access, ip6tables, sysctls
          env:
            - name: OT_RCP_DEVICE
              value: "spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=115200"
            - name: OT_INFRA_IF
              value: "bond0" # host LAN interface
            - name: OT_THREAD_IF
              value: "wpan0"
            - name: OT_LOG_LEVEL
              value: "7"
            - name: OT_REST_LISTEN_ADDR
              value: "0.0.0.0"
            - name: OT_REST_LISTEN_PORT
              value: "8081"
          ports:
            - name: rest
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: sonoff-dongle
              mountPath: /dev/ttyUSB0
            - name: data
              mountPath: /data/thread # Thread dataset/credentials survive restarts
          readinessProbe:
            httpGet:
              path: /node
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /node
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: sonoff-dongle
          hostPath:
            # stable path; find yours with: ls -l /dev/serial/by-id/
            path: /dev/ttyUSB0
        - name: data
          persistentVolumeClaim:
            claimName: otbr-data
---
apiVersion: v1
kind: Service
metadata:
  name: otbr
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: otbr
  ports:
    - name: rest
      port: 8081
      targetPort: 8081
